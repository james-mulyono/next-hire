<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridge Inbox</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2a313c; --text:#e6edf3; --muted:#8b949e; --accent:#58d39b; --warn:#f0b72f; --bad:#ff7b72; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:24px; margin:0 0 6px; }
  .note { background:#12301f; border:1px solid #23573a; padding:12px; border-radius:10px; margin:12px 0 18px; }
  .muted { color:var(--muted); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin:12px 0; }
  .card h2 { font-size:19px; margin:0 0 4px; }
  .pill { display:inline-block; font-size:13px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .pill.accepted { color:var(--accent); border-color:var(--accent); }
  .pill.requested { color:var(--warn); border-color:var(--warn); }
  .row { display:flex; gap:10px; margin-top:12px; }
  button { flex:1; padding:12px; border-radius:10px; border:0; font:inherit; font-weight:700; }
  .yes { background:var(--accent); color:#06281a; } .no { background:#30363d; color:var(--text); }
  .small { background:transparent; border:1px solid var(--line); color:var(--muted); font-weight:500; }
  .contact { margin-top:10px; padding:10px; border-radius:8px; background:#0b2216; border:1px solid #23573a; word-break:break-word; }
</style>
</head>
<body>
<main>
  <h1>Your Bridge inbox</h1>
  <div id="newnote" class="note" hidden><b>You're in.</b> Bookmark or save this page. Intro requests show up here, and nothing is shared until you say yes.</div>
  <div id="profile" class="muted"></div>
  <div id="intros"></div>
  <div class="row"><button class="small" id="pause">Pause me</button><button class="small" id="del">Delete me</button></div>
</main>
<script>
const t = new URLSearchParams(location.search).get('t');
if (new URLSearchParams(location.search).get('new')) document.getElementById('newnote').hidden = false;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function post(url, body) {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json(); if (!r.ok) throw new Error(j.detail || 'Error'); return j;
}
async function load() {
  const r = await fetch('/api/inbox?t=' + encodeURIComponent(t || ''));
  if (!r.ok) { document.querySelector('main').innerHTML = '<h1>Link not found</h1><p class="muted">This inbox doesn\'t exist or was deleted.</p>'; return; }
  const d = await r.json();
  const p = d.profile;
  document.getElementById('profile').innerHTML = `${esc(p.first_name)} · ${esc(p.strengths)}<br>Status: <b>${p.status === 'active' ? 'open to intros' : 'paused'}</b>`;
  document.getElementById('pause').textContent = p.status === 'active' ? 'Pause me' : 'Resume intros';
  const box = document.getElementById('intros');
  if (!d.intros.length) { box.innerHTML = '<div class="card muted">No intro requests yet. The agent only reaches out for strong matches.</div>'; return; }
  box.innerHTML = d.intros.map(i => `
    <div class="card">
      <span class="pill ${i.status}">${i.status === 'requested' ? 'waiting for you' : esc(i.status)}</span>
      <h2>${esc(i.company)}: ${esc(i.role)}</h2>
      <div class="muted">${esc(i.one_liner || '')}</div>
      <p><b>Why you:</b> ${esc(i.reason)}</p>
      ${i.status === 'requested' ? `<div class="row"><button class="yes" data-a="1" data-id="${i.id}">Accept intro</button><button class="no" data-a="0" data-id="${i.id}">Decline</button></div>` : ''}
      ${i.status === 'accepted' ? `<div class="contact">Founder contact: <b>${esc(i.founder_contact)}</b></div>` : ''}
    </div>`).join('');
  box.querySelectorAll('button[data-id]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await post('/api/inbox/respond', {t, intro_id: +b.dataset.id, accept: b.dataset.a === '1'}); load(); }
    catch (e) { alert(e.message); b.disabled = false; }
  });
}
document.getElementById('pause').onclick = async () => { await post('/api/inbox/pause', {t}); load(); };
document.getElementById('del').onclick = async () => {
  if (!confirm('Delete all your data from Bridge?')) return;
  await post('/api/inbox/delete', {t});
  document.querySelector('main').innerHTML = '<h1>Deleted</h1><p class="muted">Your data is gone.</p>';
};
load(); setInterval(load, 4000);
</script>
</body>
</html>
